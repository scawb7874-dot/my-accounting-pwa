<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>我的記帳</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="記帳">
</head>
<body>
<header>
  <h1>我的記帳</h1>
  <div class="subtle">本機離線記帳 · CSV 匯入/匯出 · 自動備份</div>
</header>

<main>
  <section class="card">
    <div class="section-header">
      <h2>月份與收支統計</h2>
      <input type="month" id="month-filter" aria-label="月份篩選">
    </div>
    <div class="summary-grid">
      <div class="summary-box"><div class="summary-label">收入</div><div id="summary-income" class="summary-value income">$0</div></div>
      <div class="summary-box"><div class="summary-label">支出</div><div id="summary-expense" class="summary-value expense">$0</div></div>
      <div class="summary-box"><div class="summary-label">結餘</div><div id="summary-net" class="summary-value">$0</div></div>
    </div>
  </section>

  <section class="card">
    <h2 id="form-title">新增紀錄</h2>

    <label>日期<input type="date" id="date"></label>
    <label>類型
      <select id="type">
        <option value="expense">支出</option>
        <option value="income">收入</option>
      </select>
    </label>
    <label>金額<input type="number" id="amount" inputmode="decimal" min="0" step="0.01" placeholder="0"></label>
    <label>類別
      <select id="category">
        <option value="飲食">飲食</option><option value="交通">交通</option><option value="購物">購物</option>
        <option value="娛樂">娛樂</option><option value="生活">生活</option><option value="房租">房租</option>
        <option value="醫療">醫療</option><option value="薪資">薪資</option><option value="投資">投資</option>
        <option value="其他">其他</option>
      </select>
    </label>
    <label>支付方式
      <select id="payment">
        <option value="現金">現金</option><option value="信用卡">信用卡</option><option value="LINE Pay">LINE Pay</option>
        <option value="悠遊卡">悠遊卡</option><option value="轉帳">轉帳</option><option value="其他">其他</option>
      </select>
    </label>
    <label>商家<input type="text" id="merchant" placeholder="例如：7-11"></label>
    <label>備註<input type="text" id="note" placeholder="例如：午餐"></label>

    <div class="button-row">
      <button id="save-btn" class="primary">新增紀錄</button>
      <button id="cancel-edit-btn" class="secondary hidden">取消編輯</button>
    </div>
  </section>

  <section class="card">
    <h2>圖表</h2>
    <h3>本月支出分類</h3>
    <div class="canvas-wrap"><canvas id="category-chart"></canvas></div>
    <h3>近 6 個月收支</h3>
    <div class="canvas-wrap"><canvas id="trend-chart"></canvas></div>
  </section>

  <section class="card">
    <div class="section-header">
      <h2>記帳紀錄</h2>
      <div class="small-actions">
        <button id="export-btn" class="secondary">匯出 CSV</button>
        <button id="import-btn" class="secondary">匯入 CSV</button>
        <input type="file" id="csv-file" accept=".csv,text/csv" hidden>
      </div>
    </div>
    <div id="transaction-list"></div>
  </section>

  <section class="card">
    <h2>本機備份</h2>
    <p class="subtle">App 開啟時會檢查是否超過 24 小時；若是，會在 IndexedDB 建立快照，保留最近 30 份。</p>
    <div id="backup-status" class="backup-status">尚未建立備份</div>

    <div class="button-row">
      <button id="backup-now-btn" class="secondary">立即備份</button>
      <button id="export-json-btn" class="secondary">匯出 JSON 備份</button>
      <button id="import-json-btn" class="secondary">匯入 JSON 備份</button>
      <input type="file" id="json-file" accept=".json,application/json" hidden>
    </div>

    <label>還原本機備份<select id="backup-select"></select></label>
    <button id="restore-backup-btn" class="danger">還原選取備份</button>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
